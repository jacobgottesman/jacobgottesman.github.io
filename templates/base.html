<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ config.SITE_TITLE }}{% endblock %}</title>
    <meta name="description" content="{{ config.SITE_DESCRIPTION }}">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">JG</a>
                <nav class="nav">
                    <ul class="nav-list">
                        <li><a href="/" class="nav-link">Projects</a></li>
                        <li><a href="/about/" class="nav-link">About</a></li>
                        <li><a href="/resume/" class="nav-link">Resume</a></li>
                        <li><a href="{{ config.GITHUB_URL }}" target="_blank" class="nav-link"><i class="fab fa-github"></i></a></li>
                        <li><a href="{{ config.LINKEDIN_URL }}" target="_blank" class="nav-link"><i class="fab fa-linkedin"></i></a></li>
                    </ul>
                    <button class="menu-toggle">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>
                </nav>
            </div>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-info">
                    <p>&copy; {{ now.year }} Jacob Gottesman. All rights reserved.</p>
                </div>
                <div class="footer-social">
                    <a href="mailto:{{ config.EMAIL }}" class="social-link"><i class="fas fa-envelope"></i></a>
                    <a href="{{ config.GITHUB_URL }}" target="_blank" class="social-link"><i class="fab fa-github"></i></a>
                    <a href="{{ config.LINKEDIN_URL }}" target="_blank" class="social-link"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
